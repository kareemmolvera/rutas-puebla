<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rutas Puebla - Encuentra tu camión</title>

    <!-- 1. SDK de Azure Maps (CSS) -->
    <link
      href="https://atlas.microsoft.com/sdk/javascript/mapcontrol/3/atlas.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
      }
      #mapa-usuario {
        width: 100vw;
        height: 100vh;
      }

      /* Buscador flotante limpio para el usuario */
      #panel-busqueda {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        background: white;
        padding: 10px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        display: flex;
        gap: 10px;
        width: 90%;
        max-width: 400px;
      }
      #panel-busqueda input {
        flex-grow: 1;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
      }
      #panel-busqueda button {
        padding: 10px 15px;
        background: #28a745;
        color: white;
        border: none;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
      }
      #panel-busqueda button:hover {
        background: #218838;
      }
      /* Tarjeta de indicaciones flotante */
      #tarjeta-ruta {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        background: white;
        padding: 15px 20px;
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        width: 85%;
        max-width: 350px;
        display: none; /* Oculta por defecto */
      }
      #tarjeta-ruta h3 {
        margin: 0 0 10px 0;
        color: #ff5722;
        font-size: 18px;
      }
      #tarjeta-ruta p {
        margin: 5px 0;
        font-size: 14px;
        color: #333;
      }
      #tarjeta-ruta button {
        margin-top: 10px;
        width: 100%;
        padding: 10px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
      }
      /* Indicador GPS del Usuario animado */
      /* Indicador GPS del Usuario estilo "Punto Azul" */
      .marcador-gps-usuario {
        width: 16px;
        height: 16px;
        background-color: #4285f4; /* Azul exacto de Google Maps */
        border: 3px solid white;
        border-radius: 50%;
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        position: relative;
      }

      /* Efecto de radar/halo latiendo debajo del punto */
      .marcador-gps-usuario::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100%;
        height: 100%;
        background-color: rgba(66, 133, 244, 0.4);
        border-radius: 50%;
        z-index: -1;
        animation: radar 2s infinite ease-out;
      }

      @keyframes radar {
        0% {
          width: 100%;
          height: 100%;
          opacity: 1;
        }
        100% {
          width: 350%;
          height: 350%;
          opacity: 0;
        }
      }
      /* Menú de Catálogo de Rutas */
      #btn-catalogo {
        position: absolute;
        top: 80px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        background: #007bff;
        color: white;
        border: none;
        padding: 8px 20px;
        border-radius: 20px;
        font-weight: bold;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        cursor: pointer;
        font-size: 13px;
      }
      #panel-catalogo {
        position: absolute;
        top: 120px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        background: white;
        padding: 15px;
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        width: 85%;
        max-width: 350px;
        display: none; /* Oculto por defecto */
        max-height: 50vh;
        overflow-y: auto;
      }
      .filtros-catalogo {
        display: flex;
        gap: 5px;
        margin-bottom: 10px;
      }
      .filtros-catalogo button {
        flex: 1;
        padding: 6px;
        font-size: 12px;
        border: 1px solid #ccc;
        background: #f8f9fa;
        border-radius: 4px;
        cursor: pointer;
      }
      .filtros-catalogo button:hover {
        background: #e2e6ea;
      }
      #lista-catalogo {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      #lista-catalogo li {
        padding: 10px;
        border-bottom: 1px solid #eee;
        cursor: pointer;
        font-size: 14px;
      }
      #lista-catalogo li:hover {
        background: #f1f1f1;
        color: #ff5722;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div id="tarjeta-ruta">
      <h3 id="ruta-titulo">Ruta</h3>
      <p>🟢 <b>Sube en:</b> <span id="ruta-subida"></span></p>
      <p>🔴 <b>Baja en:</b> <span id="ruta-bajada"></span></p>
      <button
        onclick="document.getElementById('tarjeta-ruta').style.display = 'none'"
      >
        Entendido
      </button>
    </div>
    <div id="mapa-usuario"></div>

    <!-- 2. SDK de Azure Maps (JS) -->
    <script src="https://atlas.microsoft.com/sdk/javascript/mapcontrol/3/atlas.min.js"></script>

    <script src ="config.js"></script>
    <script src="api.js"></script>
    <script src="usuario.js?v=5"></script>
  </body>
</html>
