<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rutas Puebla - Encuentra tu camión</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
      }
      #mapa-usuario {
        width: 100vw;
        height: 100vh;
      }

      /* Buscador flotante limpio para el usuario */
      #panel-busqueda {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        background: white;
        padding: 10px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        display: flex;
        gap: 10px;
        width: 90%;
        max-width: 400px;
      }
      #panel-busqueda input {
        flex-grow: 1;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
      }
      #panel-busqueda button {
        padding: 10px 15px;
        background: #28a745;
        color: white;
        border: none;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
      }
      #panel-busqueda button:hover {
        background: #218838;
      }
      /* Tarjeta de indicaciones flotante */
      #tarjeta-ruta {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        background: white;
        padding: 15px 20px;
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        width: 85%;
        max-width: 350px;
        display: none; /* Oculta por defecto */
      }
      #tarjeta-ruta h3 {
        margin: 0 0 10px 0;
        color: #ff5722;
        font-size: 18px;
      }
      #tarjeta-ruta p {
        margin: 5px 0;
        font-size: 14px;
        color: #333;
      }
      #tarjeta-ruta button {
        margin-top: 10px;
        width: 100%;
        padding: 10px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="tarjeta-ruta">
      <h3 id="ruta-titulo">Ruta</h3>
      <p>🟢 <b>Sube en:</b> <span id="ruta-subida"></span></p>
      <p>🔴 <b>Baja en:</b> <span id="ruta-bajada"></span></p>
      <button
        onclick="document.getElementById('tarjeta-ruta').style.display = 'none'"
      >
        Entendido
      </button>
    </div>
    <div id="mapa-usuario"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
    <script src="api.js"></script>
    <script src="usuario.js"></script>
  </body>
</html>
