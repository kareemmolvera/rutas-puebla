<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rutas Puebla - Encuentra tu camión</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
      }
      #mapa-usuario {
        width: 100vw;
        height: 100vh;
      }

      /* Buscador flotante limpio para el usuario */
      #panel-busqueda {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        background: white;
        padding: 10px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        display: flex;
        gap: 10px;
        width: 90%;
        max-width: 400px;
      }
      #panel-busqueda input {
        flex-grow: 1;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
      }
      #panel-busqueda button {
        padding: 10px 15px;
        background: #28a745;
        color: white;
        border: none;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
      }
      #panel-busqueda button:hover {
        background: #218838;
      }
    </style>
  </head>
  <body>
    <div id="panel-busqueda">
      <input
        type="text"
        id="destino"
        placeholder="¿A dónde vas? (Ej. Zócalo)"
      />
      <button onclick="buscarDestino()">Ir</button>
    </div>

    <div id="mapa-usuario"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="usuario.js"></script>
  </body>
</html>
