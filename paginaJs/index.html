<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proyecto Feria - Creador de Rutas y Paradas</title>

    <!-- 1. ADIÓS LEAFLET, HOLA AZURE MAPS (Estilos CSS) -->
    <link
      href="https://atlas.microsoft.com/sdk/javascript/mapcontrol/3/atlas.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
      }
      #mapa {
        width: 100vw;
        height: 100vh;
      }

      /* Panel de control flotante */
      #panel-control {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 1000;
        background: white;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        width: 260px;
      }
      .campo {
        margin-bottom: 12px;
      }
      .campo label {
        display: block;
        font-size: 12px;
        font-weight: bold;
        margin-bottom: 4px;
        color: #333;
      }
      .campo input,
      .campo select {
        width: 100%;
        padding: 6px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        width: 100%;
        padding: 8px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
        margin-bottom: 6px;
      }
      button:hover {
        background: #0056b3;
      }
      .btn-secundario {
        background: #6c757d;
      }
      .btn-secundario:hover {
        background: #5a6268;
      }
      .estado-trazado {
        font-size: 11px;
        text-align: center;
        color: #d9534f;
        font-weight: bold;
        margin-top: 5px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="panel-control">
      <h3>Creador de Rutas</h3>

      <div class="campo">
        <label for="nombre">Nombre de la Ruta:</label>
        <input
          type="text"
          id="nombre"
          placeholder="Ej. Alimentadora A6 Amozoc"
        />
      </div>

      <div class="campo">
        <label for="tipo">Tipo de Transporte:</label>
        <select id="tipo">
          <option value="alimentadora">Alimentadora</option>
          <option value="linea">Línea Principal (RUTA)</option>
        </select>
      </div>

      <button id="btn-trazar" onclick="conmutarModoTrazado()">
        Iniciar Trazado
      </button>
      <button
        id="btn-guardar"
        class="btn-secundario"
        onclick="guardarRuta()"
        disabled
      >
        Guardar Ruta en BD
      </button>
      <button
        id="btn-limpiar"
        class="btn-secundario"
        onclick="limpiarTrazadoActual()"
      >
        Limpiar Lienzo
      </button>

      <hr style="margin: 15px 0; border: 1px solid #eee" />

      <h4>Agregar Paradas</h4>
      <div class="campo">
        <label for="nombre-parada">Nombre de la Parada:</label>
        <input type="text" id="nombre-parada" placeholder="Ej. Parada Zócalo" />
      </div>
      <div class="campo">
        <label for="ruta-parada">Pertenece a la Ruta:</label>
        <select id="ruta-parada">
          <option value="">Cargando rutas...</option>
        </select>
      </div>
      <button
        id="btn-modo-parada"
        onclick="conmutarModoParada()"
        style="background: #28a745"
      >
        Modo Colocar Parada
      </button>

      <div id="texto-estado" class="estado-trazado"></div>
    </div>

    <div id="mapa"></div>

    <!-- 2. ADIÓS LEAFLET, HOLA AZURE MAPS (JavaScript SDK) -->
    <script src="https://atlas.microsoft.com/sdk/javascript/mapcontrol/3/atlas.min.js"></script>

    <script src="config.js"</script>
    <script src="api.js"></script>
    <script src="app.js?v=2"></script>
  </body>
</html>
